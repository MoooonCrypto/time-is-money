name: iOS CI

# Manual only: Actions tab > "iOS CI" > Run workflow (choose a branch).
# Builds the app (all Swift targets) for the iOS Simulator without signing
# (CODE_SIGNING_ALLOWED=NO), runs the Maestro UI flows in light and dark mode,
# and uploads screenshots, video and logs as a workflow artifact.
# It never writes to the repository (read-only token, no commits or pushes).
on:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: TypeScript checks (typecheck / lint / jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify

  ios:
    name: iOS Simulator build + UI test
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_ID: com.example.timeismoney
      OUT: ${{ github.workspace }}/artifacts
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Environment
        run: |
          mkdir -p "$OUT"
          xcodebuild -version | tee "$OUT/env.txt"
          sw_vers | tee -a "$OUT/env.txt"
          node -v | tee -a "$OUT/env.txt"
      - run: npm ci

      - name: Swift core tests (TIMCore)
        run: npm run test:swift-core 2>&1 | tee "$OUT/swift-core-tests.txt"

      - name: Prebuild (generate ios/ + pod install)
        run: CI=1 npx expo prebuild -p ios --clean

      - name: xcodebuild (Release, iOS Simulator, all targets)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/TimeIsMoney.xcworkspace -scheme TimeIsMoney \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build > "$OUT/xcodebuild.log" 2>&1 || {
              echo "::group::Compiler errors"; grep -E "error:|\*\* BUILD FAILED" "$OUT/xcodebuild.log" | sort -u | head -150; echo "::endgroup::"
              tail -60 "$OUT/xcodebuild.log"; exit 1; }
          grep -E "warning:.*(targets/|modules/screen-time)" "$OUT/xcodebuild.log" | sort -u | head -80 || true
          tail -5 "$OUT/xcodebuild.log"

      - name: Inspect app bundle (extensions embedded)
        run: |
          APP=build/Build/Products/Release-iphonesimulator/TimeIsMoney.app
          { echo "PlugIns:"; ls "$APP/PlugIns" || true; echo "Extensions:"; ls "$APP/Extensions" || true; } | tee "$OUT/bundle.txt"
          test -d "$APP/PlugIns/TimeIsMoneyMonitor.appex"
          test -d "$APP/PlugIns/TimeIsMoneyShieldConfig.appex"
          test -d "$APP/PlugIns/TimeIsMoneyShieldAction.appex"
          test -d "$APP/Extensions/TimeIsMoneyReport.appex"

      - name: Boot simulator + install
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID" | tee -a "$OUT/env.txt"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/TimeIsMoney.app
          # Warm-up launch: the first launch on a fresh simulator can stall (seen in run 5:
          # process up, JS never started). Launch once, wait, capture, terminate.
          xcrun simctl launch "$UDID" "$APP_ID" || true
          sleep 45
          xcrun simctl io "$UDID" screenshot "$OUT/00-warmup-launch.png" || true
          xcrun simctl terminate "$UDID" "$APP_ID" || true

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: UI test (Maestro) with video
        run: |
          maestro --version
          mkdir -p "$OUT/frames"
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/ui-flow.mp4" &
          REC=$!
          # Periodic low-res frames so results can be reviewed from the repo (no artifact download needed).
          ( i=0; while [ $i -lt 120 ]; do
              f=$(printf "$OUT/frames/frame-%03d" $i)
              xcrun simctl io "$UDID" screenshot "$f.png" >/dev/null 2>&1 && sips -s format jpeg -s formatOptions 60 -Z 700 "$f.png" --out "$f.jpg" >/dev/null 2>&1 && rm -f "$f.png"
              i=$((i+1)); sleep 4; done ) &
          SHOTS=$!
          sleep 2
          set +e
          # Warm up the XCTest driver (first start on a fresh simulator can be slow).
          maestro --device "$UDID" hierarchy > /dev/null 2>&1 || maestro --device "$UDID" hierarchy > /dev/null 2>&1
          for attempt in 1 2; do
            maestro --device "$UDID" test --test-output-dir "$OUT/maestro-out" \
              --format junit --output "$OUT/maestro-junit.xml" .maestro/onboarding.yaml 2>&1 | tee "$OUT/maestro.txt"
            STATUS=${PIPESTATUS[0]}
            [ "$STATUS" = "0" ] && break
            grep -q "driver not ready" "$OUT/maestro.txt" || break
            echo "Maestro driver timeout; retrying ($attempt)"
          done
          if [ "$STATUS" != "0" ]; then
            maestro --device "$UDID" hierarchy > "$OUT/hierarchy-after-failure.json" 2>&1
            xcrun simctl io "$UDID" screenshot "$OUT/zz-after-failure.png"
          fi
          # Dark Mode pass
          xcrun simctl ui "$UDID" appearance dark
          maestro --device "$UDID" test --test-output-dir "$OUT/maestro-out" \
            .maestro/dark.yaml 2>&1 | tee "$OUT/maestro-dark.txt"
          DARK=${PIPESTATUS[0]}
          xcrun simctl ui "$UDID" appearance light
          maestro --device "$UDID" test --test-output-dir "$OUT/maestro-out" \
            .maestro/screentime-request.yaml 2>&1 | tee "$OUT/maestro-screentime.txt"
          [ "$STATUS" = "0" ] && STATUS=$DARK
          kill $SHOTS 2>/dev/null
          kill -INT $REC; wait $REC
          mkdir -p "$OUT/maestro-debug"
          # Named screenshots from takeScreenshot (relative names) -> $OUT
          find "$OUT/maestro-out" "$HOME/.maestro/tests" "$PWD/.maestro" -name "[01][0-9]-*.png" -exec cp {} "$OUT/" \; 2>/dev/null
          find "$HOME/.maestro/tests" -name "*.png" -exec cp {} "$OUT/maestro-debug/" \; 2>/dev/null
          find "$HOME/.maestro/tests" -name "maestro.log" -exec cp {} "$OUT/maestro-debug/" \; 2>/dev/null
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "TimeIsMoney" AND NOT (subsystem == "com.apple.dt.xctest")' > "$OUT/app-log.txt" 2>&1
          grep -E "com.facebook.react|ReactNativeJS|Exception|Error" "$OUT/app-log.txt" | head -200 > "$OUT/app-log-errors.txt" || true
          exit $STATUS

      - name: Upload artifacts (video, screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
