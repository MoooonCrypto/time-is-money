# Exploratory: what happens when Screen Time access is requested on the simulator.
appId: com.example.timeismoney
---
- launchApp
- tapOn: "ホーム"
- extendedWaitUntil:
    visible:
      id: "request-screentime"
    timeout: 60000
- tapOn:
    id: "request-screentime"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 17-screentime-request-result
