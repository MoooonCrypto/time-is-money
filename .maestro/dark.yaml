# Dark Mode pass. Run after `simctl ui appearance dark`.
appId: com.example.timeismoney
---
- launchApp
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "meter-placeholder"
    timeout: 60000
- takeScreenshot: 13-dark-home
- tapOn:
    id: "open-settings"
- assertVisible: "1時間の価値.*"
- takeScreenshot: 14-dark-settings
- tapOn: "戻る"
- openLink: "timeismoney://limit-editor"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "制限の追加"
    timeout: 15000
- takeScreenshot: 15-dark-editor
- tapOn: "キャンセル"
