# Simulator UI flow (no Screen Time permission: the simulator cannot exercise
# shields / monitors / reports). Run by .github/workflows/ios-ci.yml.
appId: com.example.timeismoney
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "はじめる"
    timeout: 90000
- takeScreenshot: 01-welcome
- tapOn: "はじめる"
- assertVisible: "あなたの1時間はいくら？"
- tapOn:
    id: "rate-input"
- inputText: "1500"
- assertVisible: ".*1,500円／時間.*"
- assertVisible: "3,000円"
- takeScreenshot: 02-rate-preview
- tapOn:
    id: "rate-submit"
- assertVisible: "スクリーンタイムへのアクセス"
- takeScreenshot: 03-screentime-explain
- tapOn: "あとで設定する"
- assertVisible: ".*iOSが通知の許可を確認します.*"
- takeScreenshot: 04-notification-explain
- tapOn: "通知なしで進む"
- assertVisible: "アプリの上限を決める"
- takeScreenshot: 05-first-limit-needs-permission
- tapOn: "あとで設定する"
- assertVisible: "スクリーンタイムへのアクセスが必要です"
- assertVisible: ".*1,500円／時間.*"
# Range switch must not be hidden under the navigation header
- assertVisible: "今週"
- takeScreenshot: 06-home-needs-permission
- tapOn: "制限設定"
- assertVisible: "まだ制限はありません。"
- takeScreenshot: 07-limits-empty
- tapOn: "戻る"
- tapOn: "単価を変更"
- assertVisible: ".*1,500円／時間.*"
- takeScreenshot: 08-rate-edit
- tapOn: "戻る"
- tapOn: "権限の確認"
- assertVisible: "通知がオフです"
- takeScreenshot: 09-permissions
