# Light-mode walkthrough of every screen reachable without Screen Time access
# (the simulator cannot grant it). Run by .github/workflows/ios-ci.yml.
appId: com.example.timeismoney
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "スマホに使った時間を、この金額で数えます。"
    timeout: 90000
- tapOn:
    id: "rate-input"
- inputText: "1500"
- assertVisible: "180,000円"
- takeScreenshot: 01-onboarding-rate
- tapOn:
    id: "onboarding-next"
- assertVisible: "2つの許可"
- takeScreenshot: 02-onboarding-permissions
- tapOn:
    id: "onboarding-next"
- assertVisible: "最初の制限"
- takeScreenshot: 03-onboarding-first-limit
- tapOn:
    id: "onboarding-next"
# Home
- extendedWaitUntil:
    visible:
      id: "meter-placeholder"
    timeout: 20000
- assertVisible: "今週"
- takeScreenshot: 04-home
# Settings (gear)
- tapOn:
    id: "open-settings"
- assertVisible: "1時間の価値.*"
- takeScreenshot: 05-settings
- tapOn:
    id: "settings-rate"
- extendedWaitUntil:
    visible: "1時間あたり（円）"
    timeout: 15000
- takeScreenshot: 06-rate-sheet
- tapOn: "キャンセル"
- tapOn:
    id: "settings-screentime"
- assertVisible: "状態を再確認"
- takeScreenshot: 07-permissions
- tapOn: "戻る"
- tapOn: "戻る"
# Rule editor sheet (deep link; picking apps needs Screen Time on a device)
- openLink: "timeismoney://limit-editor"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "制限の追加"
    timeout: 15000
- takeScreenshot: 08-editor
- tapOn: "曜日別"
- assertVisible: "月曜日"
- takeScreenshot: 09-editor-weekly
- tapOn: "キャンセル"
# Limits list
- openLink: "timeismoney://limits"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "まだ制限はありません.*"
    timeout: 15000
- takeScreenshot: 10-limits
