# Light-mode walkthrough of every screen reachable without Screen Time access
# (the simulator cannot grant it). Run by .github/workflows/ios-ci.yml.
appId: com.example.timeismoney
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*いくら.*"
    timeout: 90000
- tapOn:
    id: "rate-input"
- inputText: "1500"
- assertVisible: ".*3,000円.*"
- takeScreenshot: 01-onboarding-rate
- tapOn:
    id: "onboarding-next"
- assertVisible: "アクセスの許可"
- takeScreenshot: 02-onboarding-permissions
- tapOn:
    id: "onboarding-next"
- assertVisible: "最初の制限"
- takeScreenshot: 03-onboarding-first-limit
- tapOn:
    id: "onboarding-later"
# Home tab
- extendedWaitUntil:
    visible: "Time Is Money"
    timeout: 20000
- assertVisible: "今週"
- assertVisible: "スクリーンタイムへのアクセスが必要です"
- takeScreenshot: 04-home
- scrollUntilVisible:
    element: "時間の単価"
    direction: DOWN
- assertVisible: ".*1,500円／時間.*"
- takeScreenshot: 05-home-scrolled
- tapOn:
    id: "row-current-limits"
- assertVisible: "制限はありません"
- takeScreenshot: 06-current-limits
- tapOn: "戻る"
# Limits tab
- tapOn: "制限"
- assertVisible: "まだ制限はありません"
- takeScreenshot: 07-limits
# Settings tab
- tapOn: "設定"
- assertVisible: "時間の単価"
- takeScreenshot: 08-settings
- tapOn:
    id: "settings-rate"
- assertVisible: ".*1,500円／時間.*"
- takeScreenshot: 09-rate-sheet
- tapOn: "キャンセル"
- tapOn:
    id: "settings-screentime"
- assertVisible: "スクリーンタイム"
- takeScreenshot: 10-permissions
- tapOn: "戻る"
# Rule editor sheet (opened by deep link; picking apps needs Screen Time on a device)
- openLink: "timeismoney://limit-editor"
- assertVisible: "制限の追加"
- takeScreenshot: 11-editor-daily
- tapOn: "曜日別"
- assertVisible: "月曜日"
- takeScreenshot: 12-editor-weekly
- tapOn: "キャンセル"
